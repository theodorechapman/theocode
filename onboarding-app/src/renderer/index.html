<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>theocode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" referrerpolicy="no-referrer">
  <link href="assets/vercel-brand.css" rel="stylesheet">
  <link href="app.css" rel="stylesheet">
</head>
<body class="vbg-report">
  <div class="tc-app">
    <a class="vbg-skip-link" href="#main">Skip to content</a>
    <aside class="tc-sidebar">
      <header class="tc-sidebar-head">
        <span class="tc-identity">theocode</span>
      </header>
      <nav id="tree" class="tc-tree" aria-label="Projects and sessions"></nav>
      <div class="tc-sidebar-foot">
        <button id="new-project" class="vbg-button" type="button">New project</button>
        <button id="nav-connections" class="tc-quiet-button" type="button">Connections</button>
      </div>
    </aside>
    <main id="main" class="tc-content">
      <div id="view-workspace" class="tc-view"></div>
      <div id="view-connections" class="tc-view tc-setup" hidden></div>
    </main>
  </div>
  <script type="module" src="renderer.js"></script>
</body>
</html>
