<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>theocode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" referrerpolicy="no-referrer">
  <link href="assets/vercel-brand.css" rel="stylesheet">
  <link href="app.css" rel="stylesheet">
</head>
<body class="vbg-report">
  <div class="tc-shell">
    <a class="vbg-skip-link" href="#main">Skip to content</a>
    <header class="tc-header">
      <span class="tc-identity">theocode</span>
      <span class="vbg-meta">Setup</span>
    </header>
    <main id="main" class="tc-main">
      <h1 class="vbg-title">Connect your tools</h1>
      <p class="vbg-lede">Sign in to each service below. Every connection opens your browser, completes there, and returns here on its own.</p>
      <p class="vbg-meta tc-progress" id="progress" aria-live="polite">0 of 3 connected</p>
      <div class="tc-steps" id="steps"></div>
      <p class="vbg-caption tc-note" id="note" aria-live="polite">Credentials are encrypted with your system keychain and stay on this device.</p>
    </main>
    <footer class="tc-footer">
      <span class="vbg-caption">theocode setup</span>
    </footer>
  </div>
  <script type="module" src="renderer.js"></script>
</body>
</html>
